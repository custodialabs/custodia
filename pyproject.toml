[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "custodia"
version = "0.1.0"
description = "Tamper-evident provenance & custody for source corpora."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["provenance", "chain-of-custody", "integrity", "merkle", "sha256", "tamper-evident", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
custodia = "custodia.cli:main"

[tool.setuptools.packages.find]
include = ["custodia*"]
